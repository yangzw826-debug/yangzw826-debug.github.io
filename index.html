<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点安装动画合集</title>
    <style>
        /* 全局样式重置，适配多设备 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        /* 页面标题 */
        .page-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* 动画列表容器 */
        .animation-list {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* 单个动画卡片 */
        .animation-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-align: center;
        }

        .animation-card:hover {
            transform: translateY(-5px);
        }

        .animation-card h3 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .animation-card p {
            color: #7f8c8d;
            font-size: 14px;
        }

        /* 播放模态框（点击后显示动画） */
        .play-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .play-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
        }

        .modal-content video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 5px;
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 40px;
        }

        .close-btn:hover {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <!-- 页面标题 -->
    <h1 class="page-title">节点安装动画合集</h1>

    <!-- 动画列表 -->
    <div class="animation-list" id="animationList">
        <!-- 动画卡片1（可复制多份，修改内容即可） -->
        <div class="animation-card" data-video="dazzggy.mp4">
            <h3>节点1：基础安装流程</h3>
            <p>时长：3分20秒 | 核心：安装前准备+基础固定</p>
        </div>

        <!-- 动画卡片2 -->
        <div class="animation-card" data-video="animation2.mp4">
            <h3>节点2：线路对接规范</h3>
            <p>时长：5分10秒 | 核心：电源线/信号线对接步骤</p>
        </div>

        <!-- 可根据动画数量，复制上面的卡片并修改 -->
    </div>

    <!-- 播放模态框 -->
    <div class="play-modal" id="playModal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        // 获取页面元素
        const animationList = document.getElementById('animationList');
        const playModal = document.getElementById('playModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const closeBtn = document.getElementById('closeBtn');

        // 点击动画卡片，播放对应视频
        animationList.addEventListener('click', function(e) {
            const card = e.target.closest('.animation-card');
            if (!card) return;

            // 获取视频路径
            const videoSrc = card.getAttribute('data-video');
            // 设置视频源
            videoPlayer.src = videoSrc;
            // 显示模态框
            playModal.classList.add('active');
        });

        // 点击关闭按钮，隐藏模态框并暂停视频
        closeBtn.addEventListener('click', function() {
            playModal.classList.remove('active');
            videoPlayer.pause();
            videoPlayer.src = ''; // 清空视频源，避免下次加载缓存
        });

        // 点击模态框空白处，关闭播放
        playModal.addEventListener('click', function(e) {
            if (e.target === playModal) {
                closeBtn.click();
            }
        });
    </script>
</body>

</html>
